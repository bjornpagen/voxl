[package]
# `voxl` on crates.io belongs to an unrelated crate; the binary is still `voxl`.
name = "voxl-server"
version = "0.3.5"
edition = "2021"
# The Rust that CI's Linux job builds with (nixpkgs 25.05), so clippy flags anything newer
# on every platform.
license = "MIT"
description = "Low-latency desktop streaming for the browser: an X11 display as AV1, sent over a stream through a proxy and joined in the browser by a relay"
repository = "https://github.com/bjornpagen/voxl"
readme = "README.md"
# Lets programs that embed voxl read DEP_VOXL_RPATH (see build.rs).
links = "voxl"
keywords = ["remote-desktop", "streaming", "x11", "av1"]
categories = ["command-line-utilities", "multimedia::video"]
# What `cargo publish` uploads: the sources build.rs and the server need, nothing from bench/.
include = [
	"/Cargo.toml",
	"/Cargo.lock",
	"/build.rs",
	"/src",
	"/web",
	"/README.md",
	"/LICENSE",
]

# The server, as a library for programs that embed it (the Tembo CLI's `tembo voxl`).
[lib]
name = "voxl"
path = "src/lib.rs"

[[bin]]
name = "voxl"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
	"rt-multi-thread",
	"macros",
	"net",
	"sync",
	"time",
	"signal",
	"fs",
	"io-util",
	"io-std",
	"process",
] }
axum = { version = "0.8", features = ["ws"] }
libc = "0.2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Screenshots (`voxl screenshot`).
png = "0.18"
parking_lot = "0.12"
log = { version = "0.4", features = ["std"] }
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false, features = [
	"sink",
] }
base64 = "0.22"
getrandom = "0.3"
zip = { version = "9", default-features = false, features = [
	"deflate-flate2-zlib-rs",
] }
hyper-util = { version = "0.1", features = [
	"server-auto",
	"service",
	"tokio",
	"http1",
	"http2",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = [
	"fs",
	"poll",
	"signal",
	"socket",
	"time",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = [
	"shm",
	"damage",
	"xfixes",
	"xtest",
	"shape",
	"xinput",
	"randr",
	"xkb",
] }

[dev-dependencies]
# Tests run the sessions on tokio's paused clock (`start_paused`), so time is the test's.
tokio = { version = "1", features = ["test-util"] }
# Tests read back the floats the daemon writes as JSON exactly, as a browser does.
serde_json = { version = "1", features = ["float_roundtrip"] }

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

# A match over an enum names every variant: no arm takes a variant added later unseen.
[lints.clippy]
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 1
