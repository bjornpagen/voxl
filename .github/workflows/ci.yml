name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (oxfmt, oxlint, tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run fmt:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test

  rust:
    name: Rust (rustfmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml names, by the runner's rustup.
      - run: rustup toolchain install
      # The native libraries (x264, libyuv, Opus, PulseAudio, xcb) and esbuild for
      # build.rs come from shell.nix.
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.05
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format
        run: nix-shell --run 'cargo fmt --check'
      - name: Clippy
        run: nix-shell --run 'cargo clippy --all-targets --locked -- -D warnings'
      # Unit tests, the daemon's Linux-only ones among them.
      - name: Test
        run: nix-shell --run 'cargo test --locked'
      # Builds the crate from exactly the files `cargo publish` uploads, so a file
      # missing from `include` in Cargo.toml fails here rather than at release.
      - name: Package
        run: nix-shell --run 'cargo package --locked'

  # The relay, and the daemon's core built for its tests: the daemon runs on Linux alone.
  macos:
    name: macOS (relay; rustfmt, clippy)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml names, by the runner's rustup.
      - run: rustup toolchain install
      # x264 for the core's encoder tests, esbuild for build.rs.
      - run: brew install x264 pkgconf esbuild
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
